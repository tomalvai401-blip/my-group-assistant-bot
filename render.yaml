services:
  - type: web
    name: telegram-group-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CONTACT
        value: "@your_admin"
      - key: CITY
        value: "Dhaka"
      - key: COUNTRY
        value: "Bangladesh"
      - key: TIMEZONE
        value: "Asia/Dhaka"

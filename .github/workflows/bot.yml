name: Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

# একই সময়ে শুধু ১টি Bot instance চলবে
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}

      # OpenAI API
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Prayer settings
      PRAYER_COUNTRY: ${{ secrets.PRAYER_COUNTRY }}
      PRAYER_CITY: ${{ secrets.PRAYER_CITY }}

      # Gemini API
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Bot
        run: |
          python bot.py
